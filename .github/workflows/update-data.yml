name: Update Reservoir Data

on:
  schedule:
    - cron: '0 8 * * *'  # Daily at 8 AM UTC
  workflow_dispatch:      # Manual trigger button

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Fetch latest reservoir data from CDEC API
        run: |
          # This script fetches data directly from CDEC API and generates reports
          # Note: This runs without MQTT broker, just generates JSON reports
          python api_publisher.py --reservoir ALL --days 7
        continue-on-error: true

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update reservoir data [skip ci]" && git push)

